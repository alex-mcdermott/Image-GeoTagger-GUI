name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install ExifTool and ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   brew install exiftool ffmpeg ;;
            Linux)   sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg ;;
            Windows) choco install exiftool ffmpeg -y --no-progress ;;
          esac

      - name: Build
        run: dotnet build Geotagger.slnx -c Release

      - name: Test
        run: dotnet test Geotagger.slnx -c Release --no-build

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: tests/Geotagger.Tests/bin/Release/net10.0/ui-*.png
          if-no-files-found: ignore
