name: Release

# Push a tag like v1.0.0 to build installers and publish a GitHub release.
# Run manually (workflow_dispatch) to just build the packages as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: pwsh
        run: ./build/publish-windows.ps1 -Version "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*.zip

  macos:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Package
        run: bash build/package-macos.sh "${{ matrix.rid }}" "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: artifacts/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
